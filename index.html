/* ============================================================
   GÜVENLİK AYARI — SADECE SEN GÖR
   Menüyü düzenleme paneli artık normal ziyaretçilerden tamamen
   gizli. Aşağıdaki iki değeri kendine göre değiştirebilirsin:

   1) ADMIN_URL_KEY: Paneli açmak için siteye şu şekilde girmen
      gerekir:  senin-sitenin-linki/?panel=BURAYA_YAZDIĞIN_KELİME
   2) ADMIN_PASSWORD: Panel linkine girdikten sonra "Menüyü
      Düzenle" butonuna basınca sorulacak şifre.

   Not: Bu statik bir site olduğu için, sayfa kaynak kodunu
   inceleyecek kadar teknik bilgisi olan biri bu değerleri
   görebilir. Ama normal bir müşteri QR kodu okuttuğunda bu
   butonu hiç görmeyecek, hiç fark etmeyecek bile — asıl
   çözdüğümüz sorun buydu.
   ============================================================ */
const ADMIN_URL_KEY = "boyaci2026";
const ADMIN_PASSWORD = "kafe36emirgan";

function hasAdminAccess(){
  const params = new URLSearchParams(location.search);
  return params.get('panel') === ADMIN_URL_KEY;
}

const STORAGE_KEY = 'cafeBoyacikoyMenuDraft';
let editMode = false;

function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

const $=s=>document.querySelector(s);
const catsEl=$("#categories"), menuEl=$("#menu"), draftBanner=$("#draftBanner");
const cafeEditCard=$("#cafeEditCard"), cafeEditGrid=$("#cafeEditGrid");

function saveDraft(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(MENU)); }catch(e){ console.warn('Taslak kaydedilemedi', e); } }

function loadDraftIfAny(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.cafe && parsed.categories){
        Object.assign(MENU.cafe, parsed.cafe);
        MENU.categories = parsed.categories;
        if(hasAdminAccess()) draftBanner.style.display='flex';
      }
    }
  }catch(e){ console.warn('Taslak okunamadı', e); }
}

$("#discardDraftBtn").onclick = ()=>{ localStorage.removeItem(STORAGE_KEY); location.reload(); };

function renderCafeHeader(){
  $("#eyebrow").textContent=MENU.cafe.eyebrow;
  $("#cafeName").textContent=MENU.cafe.name;
  $("#footerName").textContent=MENU.cafe.name;
  $("#tagline").textContent=MENU.cafe.tagline;
  $("#hours").textContent=MENU.cafe.hours;
  $("#footerHours").textContent=MENU.cafe.hours;
  $("#address").textContent=MENU.cafe.address;
  $("#phone").href="tel:"+MENU.cafe.phone.replace(/\s/g,"");
  $("#email").href="mailto:"+MENU.cafe.email;
  $("#maps").href=MENU.cafe.maps;
  $("#instagram").href=MENU.cafe.instagram;
  $("#facebook").href=MENU.cafe.facebook;
}

function renderCafeEditCard(){
  if(!editMode){ cafeEditCard.style.display='none'; return; }
  const fields=[
    ["name","İşletme Adı"],["eyebrow","Üst Etiket (konum)"],["tagline","Tanıtım Cümlesi"],
    ["hours","Çalışma Saatleri"],["address","Adres"],["phone","Telefon"],["email","E-posta"],
    ["instagram","Instagram Linki"],["facebook","Facebook Linki"],["maps","Google Maps Linki"]
  ];
  cafeEditGrid.innerHTML = fields.map(([key,label])=>`<div><label>${escapeHtml(label)}</label><input type="text" data-cafe-field="${key}" value="${escapeAttr(MENU.cafe[key]||'')}"></div>`).join('');
  cafeEditGrid.querySelectorAll('input').forEach(inp=>{
    inp.oninput = e=>{ MENU.cafe[inp.dataset.cafeField] = e.target.value; renderCafeHeader(); saveDraft(); };
  });
}

function renderMenu(){
  catsEl.innerHTML = MENU.categories.map((c,i)=>`<button class="${i===0?'active':''}" data-target="${c.id}">${escapeHtml(c.title)}</button>`).join('');

  menuEl.innerHTML = MENU.categories.map((c,ci)=>{
    const itemsHtml = c.items.map((x,ii)=>{
      if(editMode){
        return `<article class="item editing" data-cat="${ci}" data-item="${ii}">
          <div class="edit-fields">
            <input type="text" class="f-name" placeholder="Ürün adı" value="${escapeAttr(x.name)}">
            <textarea class="f-desc" placeholder="Açıklama">${escapeHtml(x.desc||'')}</textarea>
            <input type="text" class="f-badges" placeholder="Etiketler (virgülle ayır, örn: Müdavim seçimi, Yeni ürün)" value="${escapeAttr((x.badges||[]).join(', '))}">
          </div>
          <input type="text" class="price-input f-price" placeholder="₺0" value="${escapeAttr(x.price)}">
          <button class="del-btn" title="Ürünü sil" type="button">×</button>
        </article>`;
      }
      const featured = ii===0 && x.badges && x.badges.includes('Müdavim seçimi') ? 'featured' : '';
      const badgesHtml = x.badges && x.badges.length ? `<div class="badges">${x.badges.map(b=>`<span class="badge">${escapeHtml(b)}</span>`).join('')}</div>` : '';
      return `<article class="item ${featured}"><div><h3>${escapeHtml(x.name)}</h3><p>${escapeHtml(x.desc||'')}</p>${badgesHtml}</div><div class="price">${escapeHtml(x.price)}</div></article>`;
    }).join('');

    const head = editMode
      ? `<input type="text" class="cat-title-input f-cat-title" data-cat="${ci}" value="${escapeAttr(c.title)}"><input type="text" class="cat-note-input f-cat-note" data-cat="${ci}" placeholder="Not (örn. Günün her saati)" value="${escapeAttr(c.note||'')}">`
      : `<h2>${escapeHtml(c.title)}</h2><div class="section-note">${escapeHtml(c.note||'')}</div>`;

    const actions = editMode ? `<div class="section-actions"><button class="add-item-btn" data-cat="${ci}" type="button">+ Ürün Ekle</button><button class="del-cat-btn" data-cat="${ci}" type="button">Kategoriyi Sil</button></div>` : '';

    return `<section class="section" id="${c.id}"><div class="section-head">${head}</div>${itemsHtml}${actions}</section>`;
  }).join('');

  attachHandlers();
}

function attachHandlers(){
  catsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    document.getElementById(b.dataset.target).scrollIntoView({behavior:'smooth'});
    catsEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });

  if(!editMode) return;

  menuEl.querySelectorAll('.item.editing').forEach(el=>{
    const ci=+el.dataset.cat, ii=+el.dataset.item;
    el.querySelector('.f-name').oninput = e=>{ MENU.categories[ci].items[ii].name=e.target.value; saveDraft(); };
    el.querySelector('.f-desc').oninput = e=>{ MENU.categories[ci].items[ii].desc=e.target.value; saveDraft(); };
    el.querySelector('.f-price').oninput = e=>{ MENU.categories[ci].items[ii].price=e.target.value; saveDraft(); };
    el.querySelector('.f-badges').oninput = e=>{ MENU.categories[ci].items[ii].badges=e.target.value.split(',').map(s=>s.trim()).filter(Boolean); saveDraft(); };
    el.querySelector('.del-btn').onclick = ()=>{
      if(confirm('Bu ürünü silmek istediğine emin misin?')){ MENU.categories[ci].items.splice(ii,1); saveDraft(); renderMenu(); }
    };
  });

  menuEl.querySelectorAll('.add-item-btn').forEach(btn=>{
    btn.onclick=()=>{
      const ci=+btn.dataset.cat;
      MENU.categories[ci].items.push({name:'Yeni Ürün', desc:'', price:'₺0', badges:[]});
      saveDraft(); renderMenu();
    };
  });

  menuEl.querySelectorAll('.del-cat-btn').forEach(btn=>{
    btn.onclick=()=>{
      const ci=+btn.dataset.cat;
      if(confirm('Bu kategoriyi ve içindeki tüm ürünleri silmek istediğine emin misin?')){ MENU.categories.splice(ci,1); saveDraft(); renderMenu(); }
    };
  });

  menuEl.querySelectorAll('.f-cat-title').forEach(inp=>{
    inp.oninput=e=>{ const ci=+inp.dataset.cat; MENU.categories[ci].title=e.target.value; saveDraft(); if(catsEl.children[ci]) catsEl.children[ci].textContent=e.target.value; };
  });
  menuEl.querySelectorAll('.f-cat-note').forEach(inp=>{
    inp.oninput=e=>{ const ci=+inp.dataset.cat; MENU.categories[ci].note=e.target.value; saveDraft(); };
  });
}

$("#toggleEditBtn").onclick = ()=>{
  if(!editMode){
    const pass = prompt('Menüyü düzenlemek için şifreyi gir:');
    if(pass === null) return;
    if(pass !== ADMIN_PASSWORD){ alert('Şifre yanlış.'); return; }
  }
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  $("#toggleEditBtn").textContent = editMode ? '✔ Düzenlemeyi Bitir' : '✏️ Menüyü Düzenle';
  renderCafeEditCard();
  renderMenu();
};

$("#addCatBtn").onclick = ()=>{
  const id='kategori-'+Date.now();
  MENU.categories.push({id, title:'Yeni Kategori', note:'', items:[{name:'Yeni Ürün', desc:'', price:'₺0', badges:[]}]});
  saveDraft(); renderMenu();
};

$("#editCafeBtn").onclick = ()=>{
  cafeEditCard.style.display = cafeEditCard.style.display==='none' ? 'block' : 'none';
};

$("#downloadBtn").onclick = ()=>{
  const wasEdit = editMode;
  if(wasEdit){
    editMode=false;
    document.body.classList.remove('edit-mode');
    cafeEditCard.style.display='none';
    renderMenu();
  }
  draftBanner.style.display='none';

  let html = '<!doctype html>\n' + document.documentElement.outerHTML;
  const newBlock = '/*MENU_START*/\nconst MENU = ' + JSON.stringify(MENU, null, 2) + ';\n/*MENU_END*/';
  html = html.replace(/\/\*MENU_START\*\/[\s\S]*?\/\*MENU_END\*\//, newBlock);

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cafe-boyacikoy-menu.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);

  if(wasEdit){
    editMode=true;
    document.body.classList.add('edit-mode');
    renderCafeEditCard();
    renderMenu();
  }
};

if(!hasAdminAccess()){
  document.getElementById('adminBar').style.display = 'none';
}

loadDraftIfAny();
renderCafeHeader();
renderCafeEditCard();
renderMenu();
</script>
</body></html>
